server:
  port: 8086 # 项目启动的端口

spring:
  cloud:
    openfeign:
      client:
        config:
          xiaohashu-user:
            connectTimeout: 1000
            readTimeout: 2000
          xiaohashu-kv:
            connectTimeout: 1000
            readTimeout: 2000
          counts:
            connectTimeout: 1000
            readTimeout: 2000
          noteRelationClient:
            connectTimeout: 1000
            readTimeout: 2000
  profiles:
    active: dev # 默认激活 dev 本地开发环境

mybatis:
  # MyBatis xml 配置文件路径
  mapper-locations: classpath:/mapper/**/*.xml
# 笔记服务和计数服务使用相同的内部调用凭据
count:
  internal-token: ${COUNT_INTERNAL_TOKEN}

# 详情聚合等待上限；HTTP 超时另外约束底层请求，单位均为毫秒。
note:
  detail:
    rpc-timeout-millis: 3000
